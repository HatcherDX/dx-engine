<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hatcher Terminal</title>
    <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
    <style>
      :root {
        /* Hatcher color system */
        --bg-primary: #000000;
        --bg-secondary: #1d1f24;
        --bg-tertiary: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-tertiary: #94a3b8;
        --border-primary: #334155;
        --border-secondary: #475569;
        --accent-primary: #dfa927;
        --accent-primary-hover: #c79920;
        --accent-secondary: #0ea5e9;
        --text-on-accent: #000000;

        /* Dark sidebar colors */
        --bg-sidebar: #0c0e11;
        --bg-sidebar-header: #12141a;
        --border-sidebar: #1f2329;

        /* Typography */
        --font-system:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
          'Segoe UI', 'Segoe UI Variable Display', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Helvetica Neue', Arial, sans-serif;
        --font-mono:
          ui-monospace, 'SF Mono', SFMono-Regular, 'Cascadia Mono',
          'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Oxygen Mono',
          'Ubuntu Monospace', 'Source Code Pro', 'Fira Mono', 'Droid Sans Mono',
          'Courier New', monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-system);
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: var(--bg-secondary);
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-primary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        -webkit-app-region: drag;
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        -webkit-app-region: no-drag;
      }

      .header-logo {
        width: 24px;
        height: 24px;
        background: var(--accent-primary);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        color: var(--text-on-accent);
      }

      .header h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        color: var(--text-primary);
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        -webkit-app-region: no-drag;
      }

      .theme-switcher {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 0 10px;
        border-left: 1px solid var(--border-primary);
      }

      .theme-btn {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .theme-btn:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .theme-btn.active {
        border-color: var(--accent-primary);
        color: var(--accent-primary);
      }

      .zoom-controls {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 0 10px;
        border-left: 1px solid var(--border-primary);
      }

      .zoom-display {
        min-width: 50px;
        text-align: center;
        font-size: 13px;
        color: var(--accent-primary);
        font-family: var(--font-mono);
      }

      .btn {
        padding: 6px 12px;
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        border: 1px solid var(--border-primary);
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-family: var(--font-system);
        transition: all 0.2s;
      }

      .btn:hover:not(:disabled) {
        background: var(--border-primary);
        color: var(--text-primary);
        border-color: var(--border-secondary);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-zoom {
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        color: var(--text-on-accent);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-primary-hover);
        border-color: var(--accent-primary-hover);
      }

      .terminal-container {
        flex: 1;
        overflow: hidden;
        position: relative;
        background: var(--bg-primary);
      }

      #terminal {
        width: 100%;
        height: 100%;
      }

      .status-bar {
        background: var(--accent-primary);
        color: var(--text-on-accent);
        padding: 6px 20px;
        font-size: 12px;
        display: flex;
        gap: 20px;
        align-items: center;
        font-weight: 500;
      }

      .status-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-on-accent);
        opacity: 0.8;
      }

      .status-indicator.connected {
        background: #0dbc79;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
      }

      .keyboard-hint {
        margin-left: auto;
        opacity: 0.8;
        font-size: 11px;
      }

      /* Light theme overrides */
      body.light-theme {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-tertiary: #64748b;
        --border-primary: #e2e8f0;
        --border-secondary: #cbd5e1;
      }

      /* Loading state */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-primary);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: var(--text-secondary);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-brand">
        <div class="header-logo">H</div>
        <h1>Hatcher Terminal</h1>
      </div>
      <div class="controls">
        <button id="clear-btn" class="btn">Clear</button>
        <button id="reset-btn" class="btn">Reset</button>
        <div class="theme-switcher">
          <button id="theme-dark" class="theme-btn active" title="Dark Theme">
            🌙
          </button>
          <button id="theme-light" class="theme-btn" title="Light Theme">
            ☀️
          </button>
        </div>
        <div class="zoom-controls">
          <button id="zoom-out" class="btn btn-zoom" title="Zoom Out (Ctrl+-)">
            −
          </button>
          <span class="zoom-display" id="zoom-level">100%</span>
          <button id="zoom-in" class="btn btn-zoom" title="Zoom In (Ctrl++)">
            +
          </button>
          <button id="zoom-reset" class="btn" title="Reset Zoom (Ctrl+0)">
            Reset
          </button>
        </div>
      </div>
    </div>

    <div class="terminal-container">
      <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing Hatcher Terminal...</div>
      </div>
      <div id="terminal"></div>
    </div>

    <div class="status-bar">
      <span class="status-item">
        <span
          class="status-indicator connected"
          id="connection-indicator"
        ></span>
        <span id="backend-info">Connecting...</span>
      </span>
      <span id="terminal-size">Size: --×--</span>
      <span class="keyboard-hint"
        >Zoom: Ctrl+Plus/Minus/0 | Theme: Click 🌙/☀️</span
      >
    </div>

    <script type="module">
      import { createHatcherTerminal } from '../dist/components/HatcherTerminal.js'

      // Terminal instance
      let terminal = null
      let currentZoom = 100
      let currentTheme = 'dark'
      const MIN_ZOOM = 50
      const MAX_ZOOM = 200
      const ZOOM_STEP = 10

      // Initialize Hatcher Terminal
      async function initTerminal() {
        try {
          // Hide loading
          document.getElementById('loading').style.display = 'none'

          // Create Hatcher Terminal with minimal config
          terminal = await createHatcherTerminal('#terminal', {
            theme: currentTheme,
            welcomeMessage: true,
            fontSize: 14,
            autoResize: true,
            ipc: {
              enabled: !!window.electronAPI,
            },
          })

          // Update status
          if (window.electronAPI) {
            document.getElementById('backend-info').textContent =
              'Connected to Electron'
            document
              .getElementById('connection-indicator')
              .classList.add('connected')
          } else {
            document.getElementById('backend-info').textContent =
              'Web Mode (Limited)'
            document
              .getElementById('connection-indicator')
              .classList.remove('connected')
          }

          // Handle resize events
          terminal.onResize(({ cols, rows }) => {
            updateSizeDisplay(cols, rows)
          })

          // Focus terminal
          terminal.focus()

          // Initial size display
          const { cols, rows } = terminal.getSize()
          updateSizeDisplay(cols, rows)
        } catch (error) {
          console.error('Failed to initialize Hatcher Terminal:', error)
          document.getElementById('loading').innerHTML = `
            <div class="loading-text" style="color: #cd3131;">
              Failed to initialize terminal: ${error.message}
            </div>
          `
        }
      }

      // Zoom functions
      function zoomIn() {
        if (currentZoom < MAX_ZOOM) {
          currentZoom = Math.min(currentZoom + ZOOM_STEP, MAX_ZOOM)
          applyZoom()
        }
      }

      function zoomOut() {
        if (currentZoom > MIN_ZOOM) {
          currentZoom = Math.max(currentZoom - ZOOM_STEP, MIN_ZOOM)
          applyZoom()
        }
      }

      function resetZoom() {
        currentZoom = 100
        applyZoom()
      }

      function applyZoom() {
        if (!terminal) return

        const baseFontSize = 14
        const newFontSize = Math.round(baseFontSize * (currentZoom / 100))
        terminal.terminal.options.fontSize = newFontSize
        terminal.fit()

        document.getElementById('zoom-level').textContent = `${currentZoom}%`

        // Update button states
        document.getElementById('zoom-in').disabled = currentZoom >= MAX_ZOOM
        document.getElementById('zoom-out').disabled = currentZoom <= MIN_ZOOM
      }

      function updateSizeDisplay(cols, rows) {
        document.getElementById('terminal-size').textContent =
          `Size: ${cols}×${rows}`
      }

      // Theme switching
      function switchTheme(theme) {
        currentTheme = theme
        document.body.className = theme === 'light' ? 'light-theme' : ''

        // Update button states
        document
          .getElementById('theme-dark')
          .classList.toggle('active', theme === 'dark')
        document
          .getElementById('theme-light')
          .classList.toggle('active', theme === 'light')

        // Update terminal theme
        if (terminal) {
          terminal.updateTheme(theme)
        }
      }

      // Setup event handlers
      document.getElementById('clear-btn').addEventListener('click', () => {
        if (terminal) terminal.clear()
      })

      document.getElementById('reset-btn').addEventListener('click', () => {
        if (terminal) terminal.reset()
      })

      document.getElementById('zoom-in').addEventListener('click', zoomIn)
      document.getElementById('zoom-out').addEventListener('click', zoomOut)
      document.getElementById('zoom-reset').addEventListener('click', resetZoom)

      document.getElementById('theme-dark').addEventListener('click', () => {
        switchTheme('dark')
      })

      document.getElementById('theme-light').addEventListener('click', () => {
        switchTheme('light')
      })

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === '+' || e.key === '=') {
            e.preventDefault()
            zoomIn()
          } else if (e.key === '-' || e.key === '_') {
            e.preventDefault()
            zoomOut()
          } else if (e.key === '0') {
            e.preventDefault()
            resetZoom()
          }
        }
      })

      // Initialize on load
      initTerminal()
    </script>
  </body>
</html>
