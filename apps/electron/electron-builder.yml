# Electron Builder Configuration
# Based on electron-vite best practices from Context7

appId: com.hatcherdx.dxengine
productName: DX Engine
directories:
  output: dist
  buildResources: build
files:
  - dist-vite
  - dist

# ASAR unpacking for native modules
# Native modules cannot be executed from within ASAR archives
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/argon2/**/*
  - node_modules/@mapbox/node-pre-gyp/**/*
  - '**/*.node'
  - '**/prebuilds/**/*'
  - resources/**

# Platform-specific configurations
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  bundleVersion: '100'
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  icon: build/icon.ico
  # Disable resedit-based resource editing (icon/version metadata). It runs the
  # x64 `app-builder.exe` + downloads WinCodeSign, which throws
  # ERR_ELECTRON_BUILDER_CANNOT_EXECUTE on the Windows ARM64 runner. Disabling it
  # unblocks the arm64 packaging (CI build is unsigned anyway).
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

# Native dependencies rebuild
npmRebuild: true
nodeGypRebuild: false

# Compression settings
compression: normal
